[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cortecaja"
version = "0.1.0"
description = "Daily cash reconciliation of store orders, payment gateway settlements and bank deposits."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "tzdata>=2024.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]