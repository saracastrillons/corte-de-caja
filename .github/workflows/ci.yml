name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cortecaja
          POSTGRES_PASSWORD: cortecaja
          POSTGRES_DB: cortecaja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cortecaja -d cortecaja"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cortecaja:cortecaja@localhost:5432/cortecaja

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Migrations apply cleanly (twice)
        run: |
          python -m cortecaja.migrate
          python -m cortecaja.migrate

      - name: Tests
        run: pytest -v