services:
  db:
    image: postgres:18
    container_name: cortecaja-db
    environment:
      POSTGRES_USER: cortecaja
      POSTGRES_PASSWORD: cortecaja
      POSTGRES_DB: cortecaja
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortecaja -d cortecaja"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: cortecaja-app
    environment:
      DATABASE_URL: postgresql://cortecaja:cortecaja@db:5432/cortecaja
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: