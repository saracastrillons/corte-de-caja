<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Corte de Caja{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316233A'/%3E%3Cpath d='M9 10h14M9 16h9M9 22h14' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='16' r='2.6' fill='%23E0A458'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='desk.css') }}">
</head>
<body>
<div class="shell">

  {# ── Barra lateral: identidad y navegación ─────────────────────────────── #}
  <aside class="side">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7"/>
        <path d="M9 10h14M9 16h9M9 22h14"/>
        <circle cx="23" cy="16" r="2.6"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">Corte de Caja</span>
        <span class="brand-sub">Conciliación diaria</span>
      </span>
    </a>

    <nav class="side-nav" aria-label="Secciones">
      <a href="/" class="{% block nav_desk %}{% endblock %}">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v12H3zM3 8h14M8 8v8"/></svg>
        Mesa
      </a>
      <a href="/closes" class="{% block nav_closes %}{% endblock %}">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h10v14l-5-3-5 3z"/></svg>
        Cierres
      </a>
    </nav>

    <div class="side-foot">
      <p class="side-label">Datos</p>
      <p>Escenario de demo. La pasarela <b>SimPay</b> y el banco son simulados.</p>
      <p class="side-label">Moneda</p>
      <p>BRL · decimales exactos</p>
    </div>
  </aside>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

</div>
</body>
</html>
