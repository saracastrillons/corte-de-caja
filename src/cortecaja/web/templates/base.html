<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Corte de Caja{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='desk.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      Corte de Caja
    </a>
    <nav class="topnav" aria-label="Secciones">
      <a href="/" class="{% block nav_desk %}{% endblock %}">Mesa</a>
      <a href="/closes" class="{% block nav_closes %}{% endblock %}">Cierres</a>
    </nav>
    <span class="data-note">Escenario de demo · pasarela y banco simulados</span>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
